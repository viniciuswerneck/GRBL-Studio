<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
    />
    <title>GRBL Studio</title>
    <style>
      /*
       * Splash de abertura — apenas a arte (public/splash.png) e uma linha de
       * progresso indeterminada (anima só `transform`, DESIGN §7). A janela é
       * frameless e tem exatamente a proporção da imagem (738×328).
       */
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0d3f75;
      }
      img {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        -webkit-user-select: none;
        user-select: none;
        -webkit-user-drag: none;
      }
      .bar {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 3px;
        background: rgb(255 255 255 / 12%);
        overflow: hidden;
      }
      .bar::after {
        content: '';
        position: absolute;
        inset: 0;
        background: rgb(255 255 255 / 70%);
        transform-origin: left center;
        animation: load 1.1s ease-in-out infinite;
      }
      @keyframes load {
        0% {
          transform: translateX(-100%) scaleX(0.35);
        }
        50% {
          transform: translateX(0%) scaleX(0.65);
        }
        100% {
          transform: translateX(100%) scaleX(0.35);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <img src="splash.png" alt="GRBL Studio" />
    <div class="bar"></div>
  </body>
</html>
