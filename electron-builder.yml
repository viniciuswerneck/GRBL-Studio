appId: com.grblstudio.app
productName: GRBL Studio
publish:
  provider: github
  owner: viniciuswerneck
  repo: GRBL-Studio
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - public/**/*
  - build/icon.png
  - package.json
  - LICENSE
  - README.md
extraMetadata:
  main: dist/main/index.js
  desktopName: grbl-studio.desktop
linux:
  syncDesktopName: true
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: Vinicius Werneck
  vendor: GRBL Studio
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
win:
  target:
    - nsis
    - portable

