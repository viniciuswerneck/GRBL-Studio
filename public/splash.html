<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
    />
    <title>GRBL Studio</title>
    <style>
      /*
       * Splash de abertura — arte + logo animado + progress bar (DESIGN §7).
       * Janela frameless, proporção exata da imagem (738×328).
       * Animações: fade-in + slide up (300ms), logo pulse sutil, progress bar indeterminada.
       * Respeita `prefers-reduced-motion`.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0d3f75;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        position: relative;
      }

      /* Logo/Imagem principal com animação de entrada */
      .splash-logo {
        width: 70%;
        max-width: 480px;
        height: auto;
        opacity: 0;
        transform: translateY(20px);
        animation: logoEntrance 300ms cubic-bezier(0.33, 0, 0.67, 1) forwards;
        -webkit-user-select: none;
        user-select: none;
        -webkit-user-drag: none;
        filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.3));
      }

      @keyframes logoEntrance {
        0% {
          opacity: 0;
          transform: translateY(20px) scale(0.98);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Pulse sutil do logo (após entrada) */
      .splash-logo.entranced {
        animation: logoPulse 3s ease-in-out infinite;
      }

      @keyframes logoPulse {
        0%, 100% {
          filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.3));
        }
        50% {
          filter: drop-shadow(0 12px 32px rgba(13, 63, 117, 0.5)) brightness(1.02);
        }
      }

      /* Progress bar indeterminada (apenas transform) */
      .splash-progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        margin-top: auto;
      }

      .splash-progress::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg,
          rgba(255,255,255,0) 0%,
          rgba(255,255,255,0.7) 50%,
          rgba(255,255,255,0) 100%
        );
        transform-origin: left center;
        animation: progressLoad 1.1s ease-in-out infinite;
      }

      @keyframes progressLoad {
        0% {
          transform: translateX(-100%) scaleX(0.35);
        }
        50% {
          transform: translateX(0%) scaleX(0.65);
        }
        100% {
          transform: translateX(100%) scaleX(0.35);
        }
      }

      /* Versão/texto inferior */
      .splash-version {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        color: rgba(255, 255, 255, 0.5);
        letter-spacing: 0.5px;
        opacity: 0;
        animation: versionFadeIn 300ms ease-out 400ms forwards;
      }

      @keyframes versionFadeIn {
        from { opacity: 0; transform: translateX(-50%) translateY(4px); }
        to { opacity: 1; transform: translateX(-50%) translateY(0); }
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .splash-logo,
        .splash-logo.entranced,
        .splash-progress::after,
        .splash-version {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
        .splash-logo {
          filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.3));
        }
      }
    </style>
  </head>
  <body>
    <div class="splash-container">
      <img
        class="splash-logo"
        src="splash.png"
        alt="GRBL Studio"
      />
      <div class="splash-progress" aria-hidden="true"></div>
      <div class="splash-version" id="splashVersion">v0.22.0</div>
    </div>

    <script>
      // Lê versão da query string
      const params = new URLSearchParams(window.location.search);
      const version = params.get('version');
      const versionEl = document.getElementById('splashVersion');
      if (version) versionEl.textContent = version;

      // Trigger pulse após entrada
      logo.addEventListener('animationend', (e) => {
        if (e.animationName === 'logoEntrance') {
          logo.classList.add('entranced');
        }
      });

      // Fallback se animationend não disparar
      setTimeout(() => logo.classList.add('entranced'), 350);
    </script>
  </body>
</html>
