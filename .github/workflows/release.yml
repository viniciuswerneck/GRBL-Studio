name: Release

# Publica uma release do GitHub com os artefatos (AppImage + deb no Linux,
# .exe/.msi no Windows, .dmg no macOS) quando uma tag `v*` é empurrada.
# `workflow_dispatch` gera apenas os artefatos (upload como artifact) sem
# criar release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Empacotar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: grbl-studio-linux
            files: |
              release/*.AppImage
              release/*.deb
          - os: windows-latest
            target: win
            artifact: grbl-studio-windows
            files: |
              release/*.exe
              release/*.msi
              release/*.zip
          - os: macos-latest
            target: mac
            artifact: grbl-studio-macos
            files: |
              release/*.dmg
              release/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci
        env:
          # O app não usa navegadores do Playwright (o E2E usa o Electron).
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Qualidade (lint + tipos + testes)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Empacotar
        run: npm run build && npx electron-builder --${{ matrix.target }} --publish never --config electron-builder.yml

      - name: Artefatos (workflow_dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}

      - name: Publicar release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
          fail_on_unmatched_files: false