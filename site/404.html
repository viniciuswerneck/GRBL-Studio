<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página não encontrada — GRBL Studio</title>
    <meta name="description" content="A página que você procura não existe ou mudou de lugar. Volte para o GRBL Studio.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#070a0f">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="assets/img/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/" aria-label="GRBL Studio — início">
          <img src="assets/img/icon-64.png" width="36" height="36" alt="">
          <span class="brand-word"><span>GRBL</span><span>STUDIO</span></span>
        </a>
      </div>
    </header>

    <main class="error-page">
      <div class="container error-page__inner">
        <p class="error-code">404</p>
        <h1>Essa peça saiu do curso.</h1>
        <p>
          A página que você procura não existe ou mudou de lugar. Volte para o início e continue
          pelo caminho certo.
        </p>
        <div class="error-actions">
          <a class="btn btn-primary" href="/">Voltar ao início</a>
          <a class="btn btn-secondary" href="/#recursos">Explorar recursos</a>
          <a
            class="btn btn-secondary"
            href="https://github.com/viniciuswerneck/GRBL-Studio"
            target="_blank"
            rel="noopener noreferrer"
          >Abrir no GitHub</a>
        </div>
      </div>
    </main>
  </body>
</html>
